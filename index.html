<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>오늘의 AI 브리핑</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">KOREAN AI NEWS</p>

        <h1>오늘의 AI 브리핑</h1>

        <p class="subtitle">
          국내 최신 AI 뉴스를 10분 안에 빠르게 확인해 보세요!💡
        </p>
      </div>

      <div class="update-info">
        <span>마지막 업데이트</span>
        <strong id="updated-time">확인 중</strong>
      </div>
    </header>

    <nav class="toolbar" aria-label="뉴스 필터">
      <div class="filters">
        <button
          class="filter-button active"
          data-category="전체"
          type="button"
        >
          전체
        </button>

        <button
          class="filter-button"
          data-category="생성형 AI"
          type="button"
        >
          생성형 AI
        </button>

        <button
          class="filter-button"
          data-category="AI 반도체"
          type="button"
        >
          AI 반도체
        </button>

        <button
          class="filter-button"
          data-category="AI 정책"
          type="button"
        >
          AI 정책
        </button>
      </div>

      <button
        id="refresh-button"
        class="refresh-button"
        type="button"
      >
        새로고침
      </button>
    </nav>

    <section class="news-section">
      <div class="section-heading">
        <h2>최신 뉴스</h2>
        <span id="article-count">0개</span>
      </div>

      <div
        id="news-list"
        class="news-grid"
        aria-live="polite"
      ></div>

      <p
        id="empty-message"
        class="empty-message"
        hidden
      >
        표시할 뉴스가 없습니다.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
