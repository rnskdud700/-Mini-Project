name: Update Korean AI news

on:
  schedule:
    - cron: "15 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v6

      - name: 한국 AI 뉴스 수집하기
        run: python3 scripts/fetch_news.py

      - name: 새 뉴스 저장하기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update Korean AI news"
          git push

      - name: 사이트 배포 준비하기
        uses: actions/configure-pages@v5

      - name: 공개할 사이트 파일 모으기
        run: |
          mkdir -p _site
          cp index.html style.css script.js news.json _site/

      - name: 사이트 파일 업로드하기
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: update

    steps:
      - name: GitHub Pages에 배포하기
        id: deployment
        uses: actions/deploy-pages@v4
